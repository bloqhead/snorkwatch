<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#003d6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SnorkWatch" />
  <meta name="description" content="Is it a good day to snorkel? Find out fast." />
  <title>SnorkWatch 🤿</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Three.js ocean canvas -->
  <canvas id="ocean"></canvas>

  <!-- Update banner -->
  <div class="update-banner hidden" id="update-banner">
    <span>🆕 New version available</span>
    <button id="update-btn">Update now</button>
  </div>

  <!-- Grain overlay -->
  <div class="grain"></div>

  <!-- Sun -->
  <div class="sun" id="sun"></div>

  <!-- Main UI -->
  <div class="ui" id="ui">

    <header class="header">
      <div class="logo">
        <span class="logo-mask">🤿</span>
        <span class="logo-text">SnorkWatch</span>
      </div>
      <p class="tagline">Should you be in the water right now?</p>
    </header>

    <!-- Loading state -->
    <div class="card card--loading" id="loading">
      <div class="bubbles">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p>Reading the water…</p>
    </div>

    <!-- Error state -->
    <div class="card card--error hidden" id="error">
      <div class="error-icon">🚫</div>
      <p id="error-msg">Something went wrong. The ocean is unreadable.</p>
      <button id="retry-btn">Try Again</button>
    </div>

    <!-- Result card -->
    <div class="card card--result hidden" id="result">
      <div class="verdict-wrap">
        <div class="verdict-icon" id="verdict-icon"></div>
        <div class="verdict-label" id="verdict-label"></div>
        <div class="verdict-sub" id="verdict-sub"></div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="location-line" id="location-line"></div>

      <button id="refresh-btn" class="refresh-btn">Check Again 🔄</button>
    </div>

  </div>

  <script type="module" src="main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let newWorker;

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {

          // A new SW installed while page is open
          reg.addEventListener('updatefound', () => {
            newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              // New SW is installed and waiting — show banner
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                document.getElementById('update-banner').classList.remove('hidden');
              }
            });
          });

          // Check for updates every 60 seconds (useful for long sessions)
          setInterval(() => reg.update(), 60000);

        }).catch(() => {});

        // When SW activates after skip, reload to get fresh files
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });

      document.getElementById('update-btn').addEventListener('click', () => {
        if (newWorker) newWorker.postMessage('SKIP_WAITING');
      });
    }
  </script>
</body>
</html>
